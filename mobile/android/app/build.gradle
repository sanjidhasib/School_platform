plugins {
    id 'com.android.application'
}

android {
    namespace 'bd.edu.bzs.schoolos'
    compileSdk 34

    defaultConfig {
        applicationId 'bd.edu.bzs.schoolos'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '2.0'
        buildConfigField 'String', 'SERVER_URL', "\"${project.findProperty('schoolos.serverUrl') ?: ''}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so it installs straight from USB.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
