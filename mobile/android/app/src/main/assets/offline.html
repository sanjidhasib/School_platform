<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SchoolOS</title>
<style>
  :root { --paper:#F8F6F0; --ink:#111814; --muted:#48504C; --frame:#104028; --brand:#3CB371; --line:#CEE2D5; --surface:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#12162B; --ink:#E8EAF2; --muted:#A3AAC2; --surface:#1A1F38; --line:#2C3350; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:16px; }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--line);
          border-radius:16px; padding:24px; }
  .badge { width:48px; height:48px; border-radius:12px; background:var(--frame); display:flex;
           align-items:center; justify-content:center; margin-bottom:16px; }
  h1 { font-size:20px; margin:0 0 6px; }
  p { margin:0 0 16px; color:var(--muted); font-size:15px; }
  label { display:block; font-size:14px; font-weight:600; margin:16px 0 6px; }
  input { width:100%; font-size:16px; padding:12px; border-radius:10px; border:1px solid var(--line);
          background:var(--paper); color:var(--ink); }
  button { width:100%; font-size:16px; font-weight:600; padding:13px; border-radius:10px; border:0;
           margin-top:12px; background:var(--brand); color:#111814; }
  button.secondary { background:transparent; color:var(--ink); border:1px solid var(--line); }
  #addr { display:none; }
  small { display:block; margin-top:8px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 6.5C10.6 5.2 8.7 4.5 6.5 4.5H3.5v13H6.5c2.2 0 4.1.7 5.5 2"/>
        <path d="M12 6.5c1.4-1.3 3.3-2 5.5-2h3v13h-3c-2.2 0-4.1.7-5.5 2"/>
        <path d="M12 6.5v15"/>
      </svg>
    </div>
    <h1>Can't reach SchoolOS</h1>
    <p>Make sure the laptop running SchoolOS is on, and that this phone is on the same Wi-Fi.</p>
    <button onclick="Android.retry()">Try again</button>
    <button class="secondary" onclick="showAddr()">Change server address</button>
    <div id="addr">
      <label for="url">Server address</label>
      <input id="url" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false">
      <small>For example http://192.168.10.97:3000 — the laptop's Wi-Fi address and port 3000.</small>
      <button onclick="save()">Save and connect</button>
    </div>
  </div>
<script>
  document.getElementById('url').value = Android.getServerUrl();
  function showAddr() { document.getElementById('addr').style.display = 'block'; document.getElementById('url').focus(); }
  function save() { Android.setServerUrl(document.getElementById('url').value.trim()); }
</script>
</body>
</html>
